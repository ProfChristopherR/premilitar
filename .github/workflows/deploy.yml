name: Deploy to GitHub Pages (Production + QA)

on:
  push:
    branches: ["main", "qa"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository (fetch all branches)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Build Main (Producción)
        run: |
          git checkout main
          npm ci
          npm run build
          mkdir -p dist_combined
          cp -r dist/* dist_combined/

      - name: Build QA (Staging en /qa/)
        run: |
          if git show-ref --verify --quiet refs/remotes/origin/qa; then
            git checkout qa
            npm ci
            npm run build
            mkdir -p dist_combined/qa
            cp -r dist/* dist_combined/qa/
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist_combined

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
