<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Editor de Contenido — Sendero Pre-Militar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./src/css/base.css" />
  <link rel="stylesheet" href="./src/css/components.css" />
  <style>
    :root {
      --admin-bg: #090e17;
      --admin-card: #0f172a;
      --admin-card2: #131c2f;
      --admin-border: rgba(255, 255, 255, 0.1);
      --admin-gold: #c59b27;
      --admin-gold-light: #e5b83b;
      --admin-green: #10b981;
      --admin-red: #ef4444;
    }
    html, body {
      background: var(--admin-bg);
      color: #e2e8f0;
      font-family: 'Montserrat', sans-serif;
      min-height: 100vh;
      margin: 0;
      padding: 0;
    }
    body { display: flex; flex-direction: column; }
    .admin-header {
      background: #0d1526;
      border-bottom: 2px solid var(--admin-gold);
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 4px 20px rgba(0,0,0,0.4);
      flex-wrap: wrap;
      gap: 1rem;
    }
    .admin-brand { display: flex; align-items: center; gap: 0.75rem; }
    .admin-brand h1 { font-family: 'Cinzel', serif; font-size: 1.1rem; font-weight: 800; letter-spacing: 0.08em; color: #fff; margin: 0; text-transform: uppercase; }
    .admin-brand span { color: var(--admin-gold); }
    .admin-actions { display: flex; align-items: center; gap: 0.6rem; flex-wrap: wrap; }
    .btn-save { background: linear-gradient(135deg, #10b981 0%, #059669 100%); color: #fff; border: none; font-family: 'Cinzel', serif; font-size: 0.85rem; font-weight: 800; letter-spacing: 0.08em; padding: 0.65rem 1.3rem; border-radius: 4px; cursor: pointer; display: flex; align-items: center; gap: 0.5rem; transition: all 0.2s ease; box-shadow: 0 2px 10px rgba(16,185,129,0.3); }
    .btn-save:hover { transform: translateY(-2px); box-shadow: 0 4px 15px rgba(16,185,129,0.5); }
    .btn-save:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
    .btn-secondary { background: rgba(255,255,255,0.08); color: #fff; border: 1px solid var(--admin-border); font-family: 'Cinzel', serif; font-size: 0.8rem; font-weight: 700; padding: 0.6rem 1rem; border-radius: 4px; cursor: pointer; transition: all 0.2s; text-decoration: none; display: inline-flex; align-items: center; gap: 0.4rem; }
    .btn-secondary:hover { background: rgba(255,255,255,0.15); color: var(--admin-gold-light); }
    .btn-token { border-color: rgba(99,102,241,0.4); background: rgba(99,102,241,0.12); color: #a5b4fc; }
    .btn-token:hover { background: rgba(99,102,241,0.25); color: #fff; }
    .token-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--admin-red); display: inline-block; }
    .token-dot.connected { background: var(--admin-green); box-shadow: 0 0 6px var(--admin-green); }
    .btn-add-item { background: rgba(197,155,39,0.12); border: 1px dashed var(--admin-gold); color: var(--admin-gold-light); font-family: 'Cinzel', serif; font-size: 0.75rem; font-weight: 700; padding: 0.5rem 1rem; border-radius: 4px; cursor: pointer; margin-top: 0.5rem; display: inline-flex; align-items: center; gap: 0.4rem; transition: all 0.2s; }
    .btn-add-item:hover { background: var(--admin-gold); color: #0d1526; }
    .btn-icon { background: rgba(239,68,68,0.15); border: 1px solid rgba(239,68,68,0.3); color: #f87171; width: 32px; height: 32px; border-radius: 4px; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: all 0.2s; font-size: 0.9rem; }
    .btn-icon:hover { background: var(--admin-red); color: #fff; }
    .admin-layout { display: grid; grid-template-columns: 260px 1fr; flex: 1; max-width: 1400px; margin: 0 auto; width: 100%; padding: 2rem; gap: 2rem; box-sizing: border-box; }
    .admin-sidebar { background: var(--admin-card); border: 1px solid var(--admin-border); border-radius: 6px; padding: 1.25rem; height: fit-content; position: sticky; top: 5.5rem; }
    .sidebar-title { font-family: 'Cinzel', serif; font-size: 0.7rem; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase; color: var(--admin-gold); margin-bottom: 1rem; }
    .area-nav-list { display: flex; flex-direction: column; gap: 0.35rem; }
    .area-nav-btn { background: transparent; border: 1px solid transparent; color: #94a3b8; font-family: 'Montserrat', sans-serif; font-size: 0.82rem; font-weight: 600; padding: 0.6rem 0.8rem; border-radius: 4px; text-align: left; cursor: pointer; transition: all 0.2s ease; display: flex; align-items: center; gap: 0.5rem; }
    .area-nav-btn:hover { background: rgba(255,255,255,0.05); color: #fff; }
    .area-nav-btn.active { background: rgba(197,155,39,0.15); color: var(--admin-gold-light); border-color: rgba(197,155,39,0.4); font-weight: 700; }
    .admin-main { display: flex; flex-direction: column; gap: 1.5rem; }
    .form-card { background: var(--admin-card); border: 1px solid var(--admin-border); border-radius: 6px; padding: 1.5rem; box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
    .form-card-title { font-family: 'Cinzel', serif; font-size: 0.88rem; font-weight: 800; letter-spacing: 0.08em; color: var(--admin-gold-light); text-transform: uppercase; margin-bottom: 1.25rem; padding-bottom: 0.6rem; border-bottom: 1px solid var(--admin-border); display: flex; justify-content: space-between; align-items: center; }
    .form-group { margin-bottom: 1.1rem; }
    .form-label { display: block; font-family: 'Cinzel', serif; font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: #94a3b8; margin-bottom: 0.35rem; }
    .form-hint { font-size: 0.7rem; color: #64748b; margin-top: 0.2rem; }
    .form-input, .form-textarea, .form-select { width: 100%; background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.12); color: #fff; padding: 0.6rem 0.8rem; font-family: 'Montserrat', sans-serif; font-size: 0.88rem; border-radius: 4px; transition: border-color 0.2s; box-sizing: border-box; }
    .form-input:focus, .form-textarea:focus, .form-select:focus { outline: none; border-color: var(--admin-gold); box-shadow: 0 0 0 2px rgba(197,155,39,0.2); }
    .form-textarea { min-height: 80px; resize: vertical; line-height: 1.6; }
    .form-select option { background: #0f172a; }
    .dynamic-list-item { display: flex; gap: 0.5rem; margin-bottom: 0.5rem; align-items: center; }
    .img-upload-block { display: flex; gap: 1rem; align-items: flex-start; flex-wrap: wrap; }
    .img-preview-wrap { position: relative; width: 120px; height: 90px; flex-shrink: 0; border-radius: 4px; overflow: hidden; background: rgba(0,0,0,0.3); border: 1px solid var(--admin-border); }
    .img-preview-wrap img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .img-no-img { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; color: #475569; font-size: 1.5rem; }
    .img-upload-actions { display: flex; flex-direction: column; gap: 0.4rem; justify-content: center; }
    .btn-upload-img { background: rgba(197,155,39,0.12); border: 1px solid rgba(197,155,39,0.4); color: var(--admin-gold-light); font-family: 'Cinzel', serif; font-size: 0.72rem; font-weight: 700; padding: 0.45rem 0.8rem; border-radius: 4px; cursor: pointer; transition: all 0.2s; white-space: nowrap; }
    .btn-upload-img:hover { background: var(--admin-gold); color: #0d1526; }
    .btn-remove-img { background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.3); color: #f87171; font-family: 'Cinzel', serif; font-size: 0.72rem; font-weight: 700; padding: 0.45rem 0.8rem; border-radius: 4px; cursor: pointer; transition: all 0.2s; }
    .btn-remove-img:hover { background: var(--admin-red); color: #fff; }
    .gallery-admin-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 0.75rem; margin-bottom: 0.75rem; }
    .gallery-admin-item { position: relative; border-radius: 4px; overflow: hidden; border: 1px solid var(--admin-border); background: rgba(0,0,0,0.3); }
    .gallery-admin-item img { width: 100%; height: 90px; object-fit: cover; display: block; }
    .gallery-admin-item-actions { position: absolute; top: 4px; right: 4px; display: flex; gap: 3px; }
    .gallery-admin-item-btn { width: 24px; height: 24px; border-radius: 3px; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 0.75rem; transition: all 0.15s; }
    .gallery-admin-item-btn--del { background: rgba(239,68,68,0.85); color: #fff; }
    .gallery-admin-item-btn--del:hover { background: var(--admin-red); }
    .gallery-caption-input { width: 100%; background: rgba(0,0,0,0.4); border: none; border-top: 1px solid var(--admin-border); color: #94a3b8; font-size: 0.68rem; padding: 0.25rem 0.4rem; box-sizing: border-box; }
    .gallery-caption-input:focus { outline: none; color: #fff; background: rgba(197,155,39,0.1); }
    .project-edit-card { background: #131c2f; border: 1px solid var(--admin-border); border-left: 3px solid var(--admin-gold); border-radius: 4px; padding: 1.25rem; margin-bottom: 1rem; }
    .project-card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; }
    .project-card-title { color: var(--admin-gold); font-family: 'Cinzel', serif; font-size: 0.82rem; font-weight: 800; }
    .collapsible-section { border: 1px solid rgba(255,255,255,0.08); border-radius: 4px; margin-top: 0.75rem; overflow: hidden; }
    .collapsible-header { background: rgba(255,255,255,0.04); padding: 0.6rem 0.9rem; cursor: pointer; display: flex; justify-content: space-between; align-items: center; font-family: 'Cinzel', serif; font-size: 0.72rem; font-weight: 700; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.05em; user-select: none; transition: all 0.2s; }
    .collapsible-header:hover { background: rgba(255,255,255,0.08); color: #cbd5e1; }
    .collapsible-header.open { color: var(--admin-gold-light); background: rgba(197,155,39,0.08); }
    .collapsible-body { display: none; padding: 1rem; }
    .collapsible-body.open { display: block; }
    .collapsible-arrow { transition: transform 0.2s; }
    .collapsible-header.open .collapsible-arrow { transform: rotate(180deg); }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(4px); z-index: 1000; display: flex; align-items: center; justify-content: center; padding: 1rem; }
    .modal-dialog { background: #0f172a; border: 1px solid var(--admin-gold); border-radius: 8px; max-width: 520px; width: 100%; padding: 2rem; box-shadow: 0 10px 40px rgba(0,0,0,0.6); }
    .toast-msg { position: fixed; bottom: 2rem; right: 2rem; background: var(--admin-green); color: #fff; padding: 1rem 1.5rem; border-radius: 6px; font-weight: 700; box-shadow: 0 6px 25px rgba(0,0,0,0.6); display: none; z-index: 2000; animation: fadeIn 0.3s; max-width: 400px; line-height: 1.5; font-size: 0.9rem; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .video-admin-item { background: rgba(0,0,0,0.2); border: 1px solid var(--admin-border); border-radius: 4px; padding: 0.75rem; margin-bottom: 0.6rem; display: flex; gap: 0.75rem; align-items: flex-start; }
    .video-admin-fields { flex: 1; display: flex; flex-direction: column; gap: 0.4rem; }
    .env-selector-wrap { display: flex; align-items: center; gap: 0.4rem; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.15); padding: 0.25rem 0.5rem; border-radius: 6px; }
    .env-selector-label { font-size: 0.68rem; font-weight: 700; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.04em; }
    .env-selector-select { background: #0f172a; color: #f8fafc; border: 1px solid rgba(197,155,39,0.5); border-radius: 4px; padding: 0.25rem 0.5rem; font-size: 0.78rem; font-weight: 700; cursor: pointer; outline: none; }
    .env-selector-select:focus { border-color: var(--admin-gold); }
    @media (max-width: 900px) { .admin-layout { grid-template-columns: 1fr; } .admin-sidebar { position: static; } }
    @media (max-width: 600px) { .grid-2 { grid-template-columns: 1fr; } }
  </style>
</head>
<body>

  <header class="admin-header">
    <div class="admin-brand">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--admin-gold)" stroke-width="2.5"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
      <h1>Panel de Contenido <span>· Sendero Pre-Militar</span></h1>
    </div>
    <div class="admin-actions">
      <div class="env-selector-wrap">
        <label for="select-target-branch" class="env-selector-label">Destino:</label>
        <select id="select-target-branch" class="env-selector-select">
          <option value="qa">🟡 QA (Staging)</option>
          <option value="main">🟢 Producción (Main)</option>
        </select>
      </div>
      <button type="button" id="btn-github-token" class="btn-secondary btn-token">
        <span class="token-dot" id="token-status-dot"></span>
        <span id="token-btn-label">🔐 Conexión Segura</span>
      </button>
      <a href="index.html" class="btn-secondary" target="_blank">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6M15 3h6v6M10 14L21 3"/></svg>
        Ver Web
      </a>
      <button type="button" id="btn-download-json" class="btn-secondary" title="Descargar backup JSON">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>
        Backup
      </button>
      <button type="button" id="btn-sync-content" class="btn-secondary" style="border-color:rgba(197,155,39,0.5);color:var(--admin-gold-light);">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/></svg>
        Sync MD
      </button>
      <button type="button" id="btn-save-all" class="btn-save">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2zM17 21v-8H7v8M7 3v5h8"/></svg>
        Guardar y Publicar
      </button>
    </div>
  </header>

  <div class="admin-layout">
    <aside class="admin-sidebar">
      <div class="sidebar-title">Seleccionar Área</div>
      <div class="area-nav-list" id="admin-area-nav"></div>
    </aside>
    <main class="admin-main" id="admin-form-container"></main>
  </div>

  <!-- Modal Credenciales -->
  <div id="modal-token" class="modal-overlay" style="display:none;">
    <div class="modal-dialog">
      <h3 style="font-family:'Cinzel',serif;color:var(--admin-gold-light);margin-top:0;font-size:1.05rem;text-transform:uppercase;">🔐 Conexión Segura</h3>
      <p style="font-size:0.85rem;color:#cbd5e1;line-height:1.6;">Publica cambios directamente a GitHub con tu contraseña de administrador.</p>
      <div style="background:rgba(197,155,39,0.08);border:1px solid rgba(197,155,39,0.25);border-radius:6px;padding:0.75rem 1rem;margin-bottom:1rem;font-size:0.78rem;">
        <div style="color:#e5b83b;font-weight:700;margin-bottom:0.2rem;">🌐 Cloudflare Worker</div>
        <div style="font-family:monospace;font-size:0.72rem;color:#94a3b8;">https://premilitar-prensa-api.christopherruiz.workers.dev</div>
      </div>
      <div class="form-group">
        <label class="form-label">Contraseña de Administrador</label>
        <input type="password" id="input-admin-pass" class="form-input" placeholder="Tu contraseña..." autofocus />
      </div>
      <details style="margin-bottom:1.5rem;font-size:0.75rem;color:#94a3b8;cursor:pointer;">
        <summary style="outline:none;padding:0.3rem 0;color:var(--admin-gold);">⚙️ Opciones avanzadas</summary>
        <div style="margin-top:0.5rem;padding:0.75rem;background:rgba(255,255,255,0.03);border-radius:4px;display:flex;flex-direction:column;gap:0.6rem;">
          <div>
            <label class="form-label">URL del Microservicio</label>
            <input type="url" id="input-worker-url" class="form-input" placeholder="https://premilitar-prensa-api..." />
          </div>
          <div>
            <label class="form-label">Token GitHub (ghp_...)</label>
            <input type="password" id="input-gh-token" class="form-input" placeholder="ghp_..." />
          </div>
        </div>
      </details>
      <div style="display:flex;justify-content:flex-end;gap:0.75rem;">
        <button type="button" id="btn-cancel-token" class="btn-secondary">Cancelar</button>
        <button type="button" id="btn-save-token" class="btn-save">Guardar Credenciales</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast-msg"></div>
  <input type="file" id="file-input-hidden" accept=".webp,.jpg,.jpeg,.png" style="display:none;" />

  <script type="module">
    const REPO_OWNER        = 'ProfChristopherR';
    const REPO_NAME         = 'premilitar';
    const DEFAULT_WORKER_URL = 'https://premilitar-prensa-api.christopherruiz.workers.dev';
    const DEFAULT_IMG       = './assets/images/default-project.jpg';
    const AREA_IMG_BASE     = '/data/area-images/';

    let areasData    = [];
    let activeAreaId = '';
    let pendingImages = {}; // filename -> base64 dataURL

    // ── Branch ─────────────────────────────────────────────────────────────────
    function getActiveBranch() {
      const sel = document.getElementById('select-target-branch');
      if (sel && sel.value) return sel.value;
      return localStorage.getItem('premilitar_target_branch') || 'main';
    }
    function initBranchSelector() {
      const sel  = document.getElementById('select-target-branch');
      if (!sel) return;
      const saved = localStorage.getItem('premilitar_target_branch');
      sel.value = window.location.pathname.includes('/qa') ? 'qa' : (saved || 'main');
      updateSaveBtnText(sel.value);
      sel.addEventListener('change', () => {
        localStorage.setItem('premilitar_target_branch', sel.value);
        updateSaveBtnText(sel.value);
      });
    }
    function updateSaveBtnText(branch) {
      const btn = document.getElementById('btn-save-all');
      if (!btn) return;
      btn.innerHTML = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2zM17 21v-8H7v8M7 3v5h8"/></svg> Guardar en ${branch === 'qa' ? 'QA' : 'Producción'}`;
    }

    // ── Auth ───────────────────────────────────────────────────────────────────
    function getWorkerUrl() {
      let u = (localStorage.getItem('premilitar_worker_url') || '').trim();
      if (!u) return DEFAULT_WORKER_URL;
      if (!u.startsWith('http')) u = 'https://' + u;
      return u;
    }
    function getAdminPass()    { return (localStorage.getItem('premilitar_admin_pass') || '').trim(); }
    function getGitHubToken()  { return (localStorage.getItem('premilitar_gh_token')   || '').trim(); }
    function hasAuth()         { return !!getAdminPass() || !!getGitHubToken(); }

    function updateTokenBtn() {
      const dot   = document.getElementById('token-status-dot');
      const label = document.getElementById('token-btn-label');
      if (hasAuth()) {
        if (dot)   dot.className = 'token-dot connected';
        if (label) label.textContent = 'Conexión Activa 🔐';
      } else {
        if (dot)   dot.className = 'token-dot';
        if (label) label.textContent = 'Conexión Segura';
      }
    }
    function openModal()  { const m = document.getElementById('modal-token'); if(!m) return; document.getElementById('input-admin-pass').value = getAdminPass(); document.getElementById('input-worker-url').value = getWorkerUrl(); document.getElementById('input-gh-token').value = getGitHubToken(); m.style.display='flex'; }
    function closeModal() { const m = document.getElementById('modal-token'); if(m) m.style.display='none'; }

    // ── Load ───────────────────────────────────────────────────────────────────
    async function loadAreas() {
      try {
        areasData = await (await fetch('./data/areas.json?t=' + Date.now())).json();
        if (!activeAreaId && areasData.length) activeAreaId = areasData[0].id;
        renderNav();
        renderForm();
      } catch(e) { showToast('Error cargando datos', true); }
    }

    // ── Nav ────────────────────────────────────────────────────────────────────
    function renderNav() {
      const el = document.getElementById('admin-area-nav');
      if (!el) return;
      el.innerHTML = areasData.map(a => `<button type="button" class="area-nav-btn ${a.id === activeAreaId ? 'active':''}" data-id="${a.id}">🛡️ ${a.shortName||a.name}</button>`).join('');
      el.querySelectorAll('.area-nav-btn').forEach(b => {
        b.onclick = () => { syncForm(); activeAreaId = b.dataset.id; renderNav(); renderForm(); };
      });
    }

    // ── Utilities ──────────────────────────────────────────────────────────────
    function esc(s) { return (s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

    function resolveUrl(u) {
      if (!u) return '';
      if (u.startsWith('http://') || u.startsWith('https://') || u.startsWith('data:')) return u;
      if (u.startsWith('/data/')) return '.' + u;
      if (u.startsWith('/assets/')) return '.' + u;
      if (u.startsWith('/src/assets/')) return '.' + u.replace(/^\/src/, '');
      if (u.startsWith('src/assets/')) return './' + u.replace(/^src\//, '');
      if (u.startsWith('assets/')) return './' + u;
      if (u.startsWith('data/')) return './' + u;
      return u;
    }

    function parseArcGIS(rawUrl) {
      if (!rawUrl) return null;
      try {
        const u = new URL(rawUrl);
        let itemId = u.searchParams.get('id') || u.searchParams.get('itemId') || u.searchParams.get('webmap') || '';
        if (!itemId) { const m = u.pathname.match(/\/items\/([a-f0-9]{32})/i); if(m) itemId = m[1]; }
        return itemId ? { itemId, center: u.searchParams.get('center')||'', scale: u.searchParams.get('scale')||'4500', portalUrl: u.origin } : null;
      } catch(_) { return null; }
    }

    function pickImg(cb) {
      const inp = document.getElementById('file-input-hidden');
      inp.value = '';
      inp.onchange = async () => {
        const f = inp.files[0]; if(!f) return;
        const isWebp = f.name.toLowerCase().endsWith('.webp') || f.type === 'image/webp';
        if (!isWebp) {
          showToast('⚠️ Solo se permiten imágenes en formato .webp', true);
          return;
        }
        const reader = new FileReader();
        reader.onload = () => cb({ filename: f.name, base64: reader.result, objectUrl: URL.createObjectURL(f) });
        reader.readAsDataURL(f);
      };
      inp.click();
    }

            const fname = activeAreaId + '-proj-' + projId + '-' + filename;
            pendingImages[fname] = base64;
            card.querySelector('.proj-img-value').value = AREA_IMG_BASE + fname;
            const prev = card.querySelector('.proj-img-preview');
            if (prev) prev.src = objectUrl;
            showToast('✅ Imagen del proyecto seleccionada.');
          });
        });
      });
      document.querySelectorAll('.btn-proj-img-remove').forEach(btn => {
        btn.addEventListener('click', () => {
          const card = btn.closest('.project-edit-card');
          card.querySelector('.proj-img-value').value = '';
          const prev = card.querySelector('.proj-img-preview');
          if (prev) prev.src = DEFAULT_IMG;
        });
      });

      // ── ArcGIS auto-parse ──
      document.querySelectorAll('.proj-arcgis-url').forEach(input => {
        input.addEventListener('blur', () => {
          const card   = input.closest('.project-edit-card');
          const parsed = parseArcGIS(input.value.trim());
          if (parsed) {
            if (parsed.itemId)    card.querySelector('.proj-arcgis-itemid').value = parsed.itemId;
            if (parsed.center)    card.querySelector('.proj-arcgis-center').value  = parsed.center;
            if (parsed.scale)     card.querySelector('.proj-arcgis-scale').value   = parsed.scale;
            if (parsed.portalUrl) card.querySelector('.proj-arcgis-portal').value  = parsed.portalUrl;
            showToast('✅ Datos del mapa detectados automáticamente.');
          }
        });
      });
    }

    // ── Sync Form to State ─────────────────────────────────────────────────────
    function syncForm() {
      const area = areasData.find(a => a.id === activeAreaId);
      if (!area) return;

      // Info general
      const n = id => document.getElementById(id);
      if (n('area-name'))      area.name             = n('area-name').value;
      if (n('area-shortname')) area.shortName        = n('area-shortname').value;
      if (n('area-tagline'))   area.tagline          = n('area-tagline').value;
      if (n('area-description')) area.description   = n('area-description').value;
      if (n('area-practical')) area.practicalExample = n('area-practical').value;

      // Imágenes de sección
      if (n('hero-img-value')) area.heroImage        = n('hero-img-value').value || null;
      if (n('obj-img-value'))  area.objectivesImage  = n('obj-img-value').value  || null;
      if (n('eq-img-value'))   area.equipmentImage   = n('eq-img-value').value   || null;

      // Listas
      area.objectives = Array.from(document.querySelectorAll('.objective-input')).map(i=>i.value.trim()).filter(Boolean);
      area.equipment  = Array.from(document.querySelectorAll('.equipment-input')).map(i=>i.value.trim()).filter(Boolean);

      // Galería
      area.media = area.media || { gallery:[], videos:[] };
      area.media.gallery = Array.from(document.querySelectorAll('.gallery-admin-item')).map(item => ({
        url:     item.querySelector('.gallery-url-hidden')?.value || '',
        caption: item.querySelector('.gallery-caption')?.value   || 'Registro fotográfico'
      })).filter(g => g.url);

      // Videos
      area.media.videos = Array.from(document.querySelectorAll('.video-admin-item')).map(item => ({
        title: item.querySelector('.video-title-input')?.value || 'Video',
        url:   item.querySelector('.video-url-input')?.value   || ''
      })).filter(v => v.url);

      // Proyectos
      area.projects = Array.from(document.querySelectorAll('.project-edit-card')).map((card, idx) => {
        const existing  = (area.projects && area.projects[idx]) || {};
        const title     = card.querySelector('.proj-title')?.value.trim()      || 'Proyecto';
        const instructor= card.querySelector('.proj-instructor')?.value.trim() || '';
        const status    = card.querySelector('.proj-status')?.value            || 'Prototipo';
        const desc      = card.querySelector('.proj-desc')?.value.trim()       || '';
        const subArea   = card.querySelector('.proj-subarea')?.value           || existing.subArea;
        const imgVal    = card.querySelector('.proj-img-value')?.value         || '';
        const model3d   = card.querySelector('.proj-model3d')?.value.trim()    || '';
        const arcgisUrl = card.querySelector('.proj-arcgis-url')?.value.trim()    || '';
        const itemId    = card.querySelector('.proj-arcgis-itemid')?.value.trim() || '';
        const center    = card.querySelector('.proj-arcgis-center')?.value.trim() || '';
        const scale     = card.querySelector('.proj-arcgis-scale')?.value.trim()  || '4500';
        const portal    = card.querySelector('.proj-arcgis-portal')?.value.trim() || 'https://lpsn.maps.arcgis.com';

        return {
          ...existing,
          id: existing.id || title.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-'),
          title,
          instructor: instructor || undefined,
          status,
          description: desc,
          subArea:      subArea  || undefined,
          image:        imgVal   || undefined,
          model3dEmbed: model3d  || undefined,
          arcgis: itemId ? { _rawUrl: arcgisUrl, itemId, center, scale, portalUrl: portal } : undefined
        };
      });
    }

    // ── Save ───────────────────────────────────────────────────────────────────
    async function saveToGitHub(jsonStr, branch) {
      const token = getGitHubToken();
      if (!token) { openModal(); throw new Error('Se requiere Token de GitHub.'); }
      for (const filePath of ['public/data/areas.json', 'data/areas.json']) {
        const getRes = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${filePath}?ref=${branch}`, { headers:{ Authorization:`Bearer ${token}`, Accept:'application/vnd.github.v3+json' }});
        let sha = '';
        if (getRes.ok) sha = (await getRes.json()).sha || '';
        const putRes = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${filePath}`, {
          method: 'PUT',
          headers: { Authorization:`Bearer ${token}`, 'Content-Type':'application/json', Accept:'application/vnd.github.v3+json' },
          body: JSON.stringify({ message:`docs: actualizar áreas [${branch}]`, content: btoa(unescape(encodeURIComponent(jsonStr))), branch, ...(sha?{sha}:{}) })
        });
        if (!putRes.ok) { const e = await putRes.json(); throw new Error(e.message || 'Error en GitHub API'); }
      }
    }

    async function saveAll() {
      syncForm();
      const jsonStr = JSON.stringify(areasData, null, 2);
      const saveBtn = document.getElementById('btn-save-all');
      if (saveBtn) saveBtn.disabled = true;
      const isLocal  = ['localhost','127.0.0.1'].includes(location.hostname);
      const branch   = getActiveBranch();
      const label    = branch === 'qa' ? 'QA' : 'Producción';
      const imgsArr  = Object.entries(pendingImages).map(([filename, base64]) => ({ filename, base64 }));
      try {
        if (isLocal) {
          const r = await fetch('/api/save-areas', { method:'POST', headers:{'Content-Type':'application/json'}, body: jsonStr });
          if (r.ok) showToast('✅ Guardado localmente');
        }
        const workerUrl = getWorkerUrl();
        const adminPass = getAdminPass();
        const token     = getGitHubToken();
        if (workerUrl && adminPass) {
          showToast(`⏳ Publicando en ${label}...`);
          const payload = { branches:[branch], branch, password:adminPass, areasJson:areasData, images:imgsArr };
          const res = await fetch(workerUrl.replace(/\/+$/,'') + '/save-areas', {
            method:'POST', headers:{'Content-Type':'application/json', Authorization:'Bearer '+adminPass},
            body: JSON.stringify(payload)
          });
          const data = await res.json().catch(()=>({}));
          if (!res.ok || !data.success) throw new Error(data.error || 'Error en microservicio ('+res.status+')');
          pendingImages = {};
          showToast(`🚀 ¡Publicado en ${label}! (${data.uploadedImages||0} imágenes)`);
          return;
        }
        if (token) {
          showToast(`⏳ Publicando con token en ${label}...`);
          await saveToGitHub(jsonStr, branch);
          pendingImages = {};
          showToast(`🚀 ¡Publicado en ${label}!`);
          return;
        }
        if (!isLocal && !hasAuth()) openModal();
      } catch(err) {
        showToast('⚠️ ' + err.message, true);
        console.error(err);
      } finally {
        if (saveBtn) saveBtn.disabled = false;
      }
    }

    function downloadBackup() {
      syncForm();
      const a = Object.assign(document.createElement('a'), { href: URL.createObjectURL(new Blob([JSON.stringify(areasData,null,2)],{type:'application/json'})), download:'areas.json' });
      a.click();
    }

    function showToast(msg, isErr=false) {
      const t = document.getElementById('toast');
      if (!t) return;
      t.textContent = msg;
      t.style.background = isErr ? '#ef4444' : '#10b981';
      t.style.display = 'block';
      clearTimeout(t._t);
      t._t = setTimeout(() => t.style.display='none', 5500);
    }

    async function syncMarkdown() {
      const btn = document.getElementById('btn-sync-content');
      if (btn) btn.disabled = true;
      showToast('⏳ Sincronizando desde Markdown...');
      try {
        const d = await (await fetch('/api/sync-content', {method:'POST'})).json();
        if (d.success) { showToast('✅ ' + d.message); await loadAreas(); }
        else showToast('❌ ' + (d.error||'Error'), true);
      } catch(_) { showToast('❌ Solo funciona en localhost.', true); }
      finally { if(btn) btn.disabled = false; }
    }

    // ── Init ───────────────────────────────────────────────────────────────────
    document.getElementById('btn-github-token').onclick = openModal;
    document.getElementById('btn-cancel-token').onclick = closeModal;
    document.getElementById('btn-save-token').onclick = () => {
      const pass = (document.getElementById('input-admin-pass')?.value||'').trim();
      const url  = (document.getElementById('input-worker-url')?.value||'').trim();
      const tok  = (document.getElementById('input-gh-token')?.value||'').trim();
      if(pass) localStorage.setItem('premilitar_admin_pass', pass); else localStorage.removeItem('premilitar_admin_pass');
      if(url)  localStorage.setItem('premilitar_worker_url', url);  else localStorage.removeItem('premilitar_worker_url');
      if(tok)  localStorage.setItem('premilitar_gh_token', tok);    else localStorage.removeItem('premilitar_gh_token');
      updateTokenBtn(); closeModal(); showToast('🔑 Credenciales guardadas');
    };
    document.getElementById('btn-save-all').onclick     = saveAll;
    document.getElementById('btn-download-json').onclick = downloadBackup;
    document.getElementById('btn-sync-content').onclick  = syncMarkdown;

    updateTokenBtn();
    initBranchSelector();
    loadAreas();
  </script>
</body>
</html>
